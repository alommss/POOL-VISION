name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan proyek
        run: |
          ls -la
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            Z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
            echo "zip ditemukan: $Z"
            unzip -o "$Z"
          fi
          D=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: cd "$PROJ" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PoolVision-APK
          path: "**/build/outputs/apk/debug/*.apk"
